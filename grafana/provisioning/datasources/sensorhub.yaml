apiVersion: 1

datasources:
  - name: SensorHub TimescaleDB
    uid: sensorhub-timescale
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: $GRAFANA_DB_USER
    database: $GRAFANA_DB_NAME
    isDefault: true
    editable: false
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      postgresVersion: 1600
      sslmode: disable
      timescaledb: true
      timeInterval: 1m
      maxOpenConns: 10
      maxIdleConns: 5
      maxIdleConnsAuto: true
      connMaxLifetime: 14400
