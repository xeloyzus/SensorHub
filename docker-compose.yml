# Campus dashboard — single-host stack including ChirpStack.
#
#   chirpstack  LoRaWAN network server; uses the shared Mosquitto broker
#   gateway-bridge Semtech UDP 1700 ingress; publishes EU868 frames to MQTT
#   mosquitto   MQTT broker for Gateway Bridge, ChirpStack, and ingest
#   chirpstack-postgres / chirpstack-redis  ChirpStack state
#   ingest      decodes Milesight payloads and writes them to TimescaleDB
#   timescaledb time-series storage
#   api         FastAPI JSON API for the dashboard
#   grafana     internal admin/debug view (bound to loopback only)
#   caddy       reverse proxy with automatic HTTPS (serves frontend + /api)
#
# Secrets come from a `.env` file (see `.env.example`).
#
# Version policy (this stack is meant to run for years):
#   - Services pinned to a *specific* version below would silently break on a
#     future major upgrade, so they are pinned explicitly.
#   - `:2`, `:3.12-slim`, etc. are intentionally left floating within one
#     compatible major/minor line so they keep receiving non-breaking security
#     fixes. Bump everything deliberately once a year (see README).

name: sensorhub

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: always
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
    entrypoint: ["/bin/sh", "/mosquitto/config/start.sh"]
    environment:
      MQTT_GATEWAY_PASSWORD: ${MQTT_GATEWAY_PASSWORD:?set MQTT_GATEWAY_PASSWORD in .env}
      MQTT_INGEST_PASSWORD: ${MQTT_INGEST_PASSWORD:?set MQTT_INGEST_PASSWORD in .env}
      MQTT_CHIRPSTACK_PASSWORD: ${MQTT_CHIRPSTACK_PASSWORD:?set MQTT_CHIRPSTACK_PASSWORD in .env}
      MQTT_FORWARDER_PASSWORD: ${MQTT_FORWARDER_PASSWORD:?set MQTT_FORWARDER_PASSWORD in .env}
      MQTT_BRIDGE_PASSWORD: ${MQTT_BRIDGE_PASSWORD:?set MQTT_BRIDGE_PASSWORD in .env}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/start.sh:/mosquitto/config/start.sh:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: always
    command: ["-c", "/etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge.toml"]
    depends_on:
      mosquitto:
        condition: service_started
    environment:
      INTEGRATION__MQTT__AUTH__GENERIC__USERNAME: sensorhub-gateway-bridge
      INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD: ${MQTT_BRIDGE_PASSWORD:?set MQTT_BRIDGE_PASSWORD in .env}
    volumes:
      - ./chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge:ro
    ports:
      - "${GATEWAY_BRIDGE_BIND_ADDRESS:-0.0.0.0}:1700:1700/udp"

  chirpstack-postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: chirpstack
      POSTGRES_USER: chirpstack
      POSTGRES_PASSWORD: ${CHIRPSTACK_POSTGRES_PASSWORD:?set CHIRPSTACK_POSTGRES_PASSWORD in .env}
    volumes:
      - chirpstack-postgres-data:/var/lib/postgresql/data
      - ./chirpstack/postgresql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirpstack -d chirpstack"]
      interval: 10s
      timeout: 5s
      retries: 10

  chirpstack-redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - chirpstack-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  chirpstack:
    image: chirpstack/chirpstack:4
    restart: always
    command: ["-c", "/etc/chirpstack"]
    depends_on:
      chirpstack-postgres:
        condition: service_healthy
      chirpstack-redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      CHIRPSTACK_POSTGRES_PASSWORD: ${CHIRPSTACK_POSTGRES_PASSWORD:?set CHIRPSTACK_POSTGRES_PASSWORD in .env}
      CHIRPSTACK_API_SECRET: ${CHIRPSTACK_API_SECRET:?set CHIRPSTACK_API_SECRET in .env}
      MQTT_CHIRPSTACK_PASSWORD: ${MQTT_CHIRPSTACK_PASSWORD:?set MQTT_CHIRPSTACK_PASSWORD in .env}
    volumes:
      - ./chirpstack/configuration:/etc/chirpstack:ro
    ports:
      - "${CHIRPSTACK_BIND_ADDRESS:-127.0.0.1}:${CHIRPSTACK_HTTP_PORT:-8081}:8080"

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16  # pinned — a future 3.x would be breaking
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sensorhub}
      POSTGRES_USER: ${POSTGRES_USER:-sensorhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sensorhub} -d ${POSTGRES_DB:-sensorhub}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sensorhub}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:-sensorhub}
    command: ["python", "-m", "app.db.migrate"]

  ingest:
    build: ./ingest
    restart: always
    depends_on:
      mosquitto:
        condition: service_started
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sensorhub}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:-sensorhub}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: ${MQTT_TOPIC:-application/+/device/+/event/up}
      MQTT_USERNAME: sensorhub-ingest
      MQTT_PASSWORD: ${MQTT_INGEST_PASSWORD:?set MQTT_INGEST_PASSWORD in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: always
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sensorhub}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:-sensorhub}
      DISPLAY_REFRESH_SECONDS: ${DISPLAY_REFRESH_SECONDS:-60}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  grafana:
    image: grafana/grafana:11.3.1  # pinned — a future major would be breaking
    restart: always
    # Internal debugging only. Bound to loopback: reach it via an SSH tunnel
    # (ssh -L 3000:localhost:3000 user@linux-server) rather than a public URL.
    ports:
      - "127.0.0.1:3200:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana

  caddy:
    image: caddy:2
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mosquitto-data:
  mosquitto-log:
  chirpstack-postgres-data:
  chirpstack-redis-data:
  timescale-data:
  grafana-data:
  caddy-data:
  caddy-config:
