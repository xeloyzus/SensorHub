# EU868 is the LoRaWAN region used by the UG65 gateways in Norway.
[[regions]]
name = "eu868"
common_name = "EU868"

[regions.gateway]
force_gws_private = false

[regions.gateway.backend]
enabled = "mqtt"

[regions.gateway.backend.mqtt]
topic_prefix = "eu868"
server = "tcp://mosquitto:1883"
username = "sensorhub-chirpstack"
password = "$MQTT_CHIRPSTACK_PASSWORD"
