# Run core services and the migration job in the isolated test project.
# See tests/run_integration.py; production services/volumes are not reused.
services:
  api:
    ports:
      - "127.0.0.1:${INTEGRATION_API_PORT:-18080}:8000"
  ingest:
    environment:
      PYTHONPATH: /app
      ADMIN_DATABASE_URL: postgresql://sensorhub:integration-database-only@timescaledb:5432/sensorhub_integration
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ./tests:/tests:ro
      - ./app:/app/app:ro
      - ./hardware:/hardware:ro
