<!DOCTYPE html>
<html lang="en" class="{% block html_class %}{% endblock %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#051850">
  <meta name="description" content="Campus dashboard — live indoor climate and electricity data across campus buildings, with trends, data quality, and practical insights.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{% block title %}Campus dashboard{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <link rel="stylesheet" href="/static/css/palette.css?v=20261101-campus-colours">
  <link rel="stylesheet" href="/static/css/styles.css?v=20261125-rooms">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
