# Mosquitto broker for NanitesLab.
# Receives LoRaWAN uplinks from the Milesight UG65 gateways.

listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

# Persist retained messages / sessions across restarts.
persistence true
persistence_location /mosquitto/data/

# Keep logs inside the container volume.
log_dest stdout

# Port 1883 is published on loopback by default. Gateways must connect over
# an encrypted VPN/tunnel; never expose this plaintext listener publicly.
